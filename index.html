  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --card-bg:      #e2e3e5;
      --text-main:    #4e5356;
      --text-mute:    #7a8080;
      --accent-deep:  #3753b1;
      --accent-light: #4f9edd;
      --paper:        #efefef;
      --btn-bg:       #e2e3e5;
      --paper-soft:   #f8f9fa;
    }

    html, body { background: var(--paper-soft); }

    body {
      font-family: "Source Sans Pro", "Pretendard", -apple-system, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px 14px 60px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 480px; margin: 0 auto; }

    /* ===== 명함 카드 ===== */
    .business-card {
      position: relative;
      background: var(--card-bg);
      aspect-ratio: 1.72 / 1;
      width: 100%;
      border-radius: 14px;
      box-shadow:
        0 26px 40px -12px rgba(0,0,0,0.22),
        0 12px 18px -6px rgba(0,0,0,0.14),
        0 1px 0 0 rgba(255,255,255,0.6) inset;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(0,0,0,0.05);
      animation: cardIn 0.7s cubic-bezier(0.2,0.8,0.2,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .business-card::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent-light));
      pointer-events: none;
    }

    .brand-logo-area {
      position: absolute;
      top: 12%; right: 6%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .byd-logo-img {
      width: clamp(95px, 22vw, 125px);
      height: auto;
      display: block;
      opacity: 0.9;
    }

    .card-content {
      position: absolute;
      left: 6%; right: 6%; bottom: 11%;
      z-index: 2;
    }

    .name-line {
      font-weight: 700;
      font-size: clamp(20px, 4.8vw, 26px);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .name-line span.title {
      font-size: 0.52em;
      font-weight: 600;
      color: var(--text-mute);
    }

    .sub-title-line,
    .showroom-line,
    .info-line {
      font-family: "Source Sans Pro", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      color: var(--text-mute);
      margin-bottom: 2.7px;
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .info-line.phone-bold {
      font-weight: 800;
      color: var(--text-main);
      font-size: clamp(13px, 3vw, 16px);
      margin-top: 0;
      margin-bottom: 0;
    }

    /* ===== 섹션 공통 ===== */
    .section {
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 20px -6px rgba(0,0,0,0.12);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* ===== CTA 버튼 ===== */
    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cta-button {
      padding: 15px 12px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: -0.01em;
    }

    .cta-button:active { transform: scale(0.97); }

    .cta-primary {
      background: var(--accent-deep);
      color: #ffffff;
      box-shadow: 0 10px 22px -4px rgba(55,83,177,0.45);
    }
    .cta-primary:hover { background: #2b4291; }

    .cta-secondary {
      background: var(--btn-bg);
      color: var(--accent-deep);
      border: 1.5px solid var(--accent-deep);
      box-shadow: 0 10px 20px -6px rgba(0,0,0,0.15);
    }
    .cta-secondary:hover { background: #e5e5e5; }

    /* ===== 액션 그리드 ===== */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 4px 12px;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      border: none;
      color: inherit;
      text-decoration: none;
      font-family: inherit;
      box-shadow: 0 4px 10px -2px rgba(0,0,0,0.1);
    }

    .action-item:active {
      transform: scale(0.95);
      background: #edf0f2;
    }

    .action-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .action-badge {
      width: 26px;
      height: 26px;
      margin-bottom: 7px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
    }

    /* ===== 지도 ===== */
    .map-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #ffffff;
      border-radius: 12px;
      margin-top: 4px;
      box-shadow: 0 4px 10px -2px rgba(0,0,0,0.08);
    }

    .map-pin {
      flex-shrink: 0;
      width: 36px; height: 36px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .map-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .map-text span {
      color: var(--text-mute);
      font-size: 12px;
    }

    /* ===== 푸터 ===== */
    .footer {
      text-align: center;
      padding: 32px 0 10px;
      font-size: 14px;
      color: #bbb;
      letter-spacing: 0.15em;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ===== 토스트 ===== */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 13px 22px;
      border-radius: 32px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.2,0.8,0.2,1);
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 12px 32px -8px rgba(0,0,0,0.4);
      letter-spacing: -0.01em;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 공유 모달 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 22px 22px 0 0;
      padding: 22px 20px 28px;
      animation: slideUp 0.3s cubic-bezier(0.2,0.8,0.2,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-grip {
      width: 40px; height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
    .modal-desc {
      font-size: 13px;
      color: var(--text-mute);
      margin-bottom: 18px;
      letter-spacing: -0.005em;
    }
    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .modal-item {
      padding: 14px 14px;
      border-radius: 12px;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .modal-item:active { background: #edf0f2; }

    .modal-item-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-item-text { flex: 1; }
    .modal-item-text strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 1px;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }
    .modal-item-text span {
      font-size: 12px;
      color: var(--text-mute);
      letter-spacing: -0.005em;
    }
    .modal-close {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-mute);
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>

<body>

  <script>
    /* =====================================================
       연락처 정보 (단일 출처 관리)
    ===================================================== */
    const CONTACT = {
      name:       '박민용',
      title:      '팀장/차장',
      company:    'DT Networks',
      showroom:   'BYD 일산전시장',
      mobile:     '01089411004',
      office:     '0319110940',
      email:      'minyong.park@dtnetworks.co.kr',
      address:    '경기도 고양시 일산동구 백마로 516',
      placeQuery: 'BYD 일산전시장'
    };

    /* ===== Toast ===== */
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* ===== 전화 / 문자 / 이메일 ===== */
    function callMobile()  { window.location.href = 'tel:' + CONTACT.mobile; }
    function callOffice()  { window.location.href = 'tel:' + CONTACT.office; }
    function sendSMS()     { window.location.href = 'sms:' + CONTACT.mobile; }
    function sendEmail()   { window.location.href = 'mailto:' + CONTACT.email; }

    /* ===== 연락처 저장 (vCard) ===== */
    function saveContact() {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:' + CONTACT.name + ';;;;',
        'FN:' + CONTACT.name,
        'ORG:' + CONTACT.company,
        'TITLE:' + CONTACT.title,
        'TEL;TYPE=CELL:' + CONTACT.mobile,
        'TEL;TYPE=WORK:' + CONTACT.office,
        'EMAIL;TYPE=WORK:' + CONTACT.email,
        'ADR;TYPE=WORK:;;' + CONTACT.address,
        'URL:' + window.location.href,
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob(['\uFEFF' + vcard], { type: 'text/vcard;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = CONTACT.name + '.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('연락처 파일이 저장되었습니다');
    }

    /* ===== 지도 앱 연동 ===== */
    function tryAppLink(appUrl, fallbackUrl) {
      const timer = setTimeout(() => { window.location.href = fallbackUrl; }, 1200);
      window.location.href = appUrl;
      window.addEventListener('pagehide', () => clearTimeout(timer), { once: true });
    }

    function openTmap() {
      const q = encodeURIComponent(CONTACT.placeQuery);
      tryAppLink('tmap://search?name=' + q, 'https://surl.tmobiapi.com/d97deca3');
    }
    function openKakaoMap() {
      window.location.href = 'https://map.kakao.com/link/search/' + encodeURIComponent(CONTACT.placeQuery);
    }
    function openNaverMap() {
      const q = encodeURIComponent(CONTACT.placeQuery);
      tryAppLink('nmap://search?query=' + q + '&appname=dt.networks.card', 'https://map.naver.com/p/search/' + q);
    }

    /* ===== 공유 모달 ===== */
    function openShareModal()  { document.getElementById('share-modal').classList.add('show'); }
    function closeShareModal(e) {
      if (!e || e.target === e.currentTarget) {
        document.getElementById('share-modal').classList.remove('show');
      }
    }

    function shareViaSystem() {
      closeShareModal();
      if (navigator.share) {
        navigator.share({
          title: '박민용 팀장 | BYD 일산전시장',
          text:  'BYD 일산전시장 박민용 팀장 명함',
          url:   window.location.href
        }).catch(function(){});
      } else {
        copyLink();
      }
    }

    function copyLink() {
      closeShareModal();
      navigator.clipboard.writeText(window.location.href)
        .then(function()  { showToast('링크가 복사되었습니다'); })
        .catch(function() { showToast('복사에 실패했습니다'); });
    }

    function shareImageDirect() {
      closeShareModal();
      downloadCardImage(true);
    }

    /* ===== 명함 → PNG 고해상도 캡처 (html2canvas) ===== */
    function downloadCardImage(viaShare) {
      viaShare = viaShare || false;
      showToast('이미지를 생성 중입니다...');

      var original   = document.getElementById('business-card');
      var clone      = original.cloneNode(true);
      var captureBox = document.createElement('div');

      captureBox.style.cssText = [
        'position:fixed',
        'top:0',
        'left:-9999px',
        'width:1500px',
        'pointer-events:none',
        'z-index:-1'
      ].join(';');

      clone.style.cssText = [
        'width:1500px',
        'max-width:1500px',
        'margin:0',
        'box-shadow:none',
        'border-radius:0',
        'animation:none',
        'opacity:1',
        'transform:none'
      ].join(';');
      clone.id = 'capture-card';

      var nameLine = clone.querySelector('.name-line');
      if (nameLine) {
        nameLine.style.fontSize    = '72px';
        nameLine.style.fontWeight  = '700';
        nameLine.style.marginBottom = '15px';
      }

      var subLines = clone.querySelectorAll('.sub-title-line, .showroom-line, .info-line');
      subLines.forEach(function(el) {
        el.style.fontSize    = '44px';
        el.style.lineHeight  = '1.4';
        el.style.marginBottom = '8px';
        if (el.classList.contains('phone-bold')) {
          el.style.fontWeight = '800';
          el.style.fontSize   = '46px';
        }
      });

      var logoImg = clone.querySelector('.byd-logo-img');
      if (logoImg) { logoImg.style.width = '350px'; }

      captureBox.appendChild(clone);
      document.body.appendChild(captureBox);

      function renderCapture() {
        html2canvas(clone, {
          scale:       2,
          backgroundColor: '#e2e3e5',
          useCORS:     true,
          logging:     false,
          width:       1500,
          windowWidth: 1500
        }).then(function(canvas) {
          if (captureBox.parentNode) document.body.removeChild(captureBox);

          if (viaShare && navigator.canShare) {
            canvas.toBlob(function(blob) {
              var file = new File([blob], '박민용_BYD명함.png', { type: 'image/png' });
              if (navigator.canShare({ files: [file] })) {
                navigator.share({
                  files: [file],
                  title: '박민용 | BYD 일산전시장',
                  text:  'BYD 일산전시장 박민용 팀장 명함입니다.'
                }).catch(function() { fallbackDownload(canvas); });
              } else {
                fallbackDownload(canvas);
              }
            }, 'image/png');
          } else {
            fallbackDownload(canvas);
          }
        }).catch(function(err) {
          if (captureBox.parentNode) document.body.removeChild(captureBox);
          showToast('이미지 생성에 실패했습니다');
          console.error(err);
        });
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() { setTimeout(renderCapture, 150); });
      } else {
        setTimeout(renderCapture, 400);
      }
    }

    function fallbackDownload(canvas) {
      var a      = document.createElement('a');
      a.download = '박민용_BYD명함.png';
      a.href     = canvas.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('명함 이미지가 저장되었습니다');
    }
  </script>
</body>
</html>
