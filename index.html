<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일 뷰포트 설정: 확대/축소 비활성화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>박민용 | BYD 일산전시장</title>

  <!-- Open Graph 메타태그: SNS 공유 시 미리보기 정보 -->
  <meta property="og:type"        content="profile" />
  <meta property="og:title"       content="박민용 팀장 | BYD Ilsan" />
  <meta property="og:description" content="010-8941-1004" />
  <meta property="og:image"       content="byd-logo.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="theme-color"        content="#3753B1" />

  <!-- ===== 폰트 프리커넥트: DNS 조회 선행으로 렌더링 지연 최소화 ===== -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Pretendard (한글 본문용) -->
  <link
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    rel="stylesheet"
  />
  <!-- Source Sans Pro (영문/숫자 강조용) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =====================================================
       1. 전역 리셋 & 박스 모델
    ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================================
       2. CSS 변수 (디자인 토큰)
    ===================================================== */
    :root {
      --card-bg:        #e2e3e5;  /* 명함 카드 배경 */
      --text-main:     #4e5356;  /* 주요 텍스트 */
      --text-mute:     #7a8080;  /* 보조 텍스트 */
      --accent-deep: #3753b1;  /* 강조색 (딥 블루) */
      --accent-light:  #4f9edd;  /* 강조색 (라이트 블루) */
      --paper:            #efefef;  /* 흰 배경 (카드 내부 등) */
      --btn-bg:         #e2e3e5;  /* 버튼/섹션 배경 */
      --paper-soft:     #f8f9fa;  /* 페이지 전체 배경 */
    }

    /* =====================================================
       3. 기본 레이아웃
    ===================================================== */
    html, body {
      background: var(--paper-soft);
      font-family: "Source Sans Pro", "Pretendard", -apple-system, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px 14px 60px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* =====================================================
       4. 디지털 명함 카드
    ===================================================== */
    .business-card {
      position: relative;
      background: var(--card-bg);
      aspect-ratio: 1.72 / 1;
      width: 100%;
      border-radius: 14px;
      box-shadow:
        0 26px 40px -12px rgba(0, 0, 0, 0.22),
        0 12px 18px -6px rgba(0, 0, 0, 0.14),
        0 1px 0 0 rgba(255, 255, 255, 0.6) inset;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      animation: cardIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    .business-card::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent-light));
      pointer-events: none;
    }

    .brand-logo-area {
      position: absolute;
      top: 12%; right: 6%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .byd-logo-img {
      width: clamp(95px, 22vw, 125px);
      height: auto;
      display: block;
      opacity: 0.9;
    }

    .card-content {
      position: absolute;
      left: 6%; right: 6%; bottom: 11%;
      z-index: 2;
    }

    .name-line {
      font-weight: 700;
      font-size: clamp(20px, 4.8vw, 26px);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .name-line span.title {
      font-size: 0.52em;
      font-weight: 600;
      color: var(--text-mute);
    }

    .sub-title-line, .showroom-line, .info-line {
      font-family: "Source Sans Pro", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      color: var(--text-mute);
      margin-bottom: 2.7px;
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .info-line.phone-bold {
      font-weight: 800;
      color: var(--text-main);
      font-size: clamp(13px, 3vw, 16px);
      margin-top: 0;
      margin-bottom: 0;
    }

    /* =====================================================
       5. 하단 섹션 공통 스타일
    ===================================================== */
    .section {
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.12);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cta-button {
      padding: 15px 12px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: -0.01em;
    }

    .cta-button:active { transform: scale(0.97); }

    .cta-primary {
      background: var(--accent-deep);
      color: #ffffff;
      box-shadow: 0 10px 22px -4px rgba(55, 83, 177, 0.45);
    }
    .cta-primary:hover { background: #2b4291; }

    .cta-secondary {
      background: var(--btn-bg);
      color: var(--accent-deep);
      border: 1.5px solid var(--accent-deep);
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.15);
    }
    .cta-secondary:hover { background: #e5e5e5; }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 4px 12px;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      border: none;
      color: inherit;
      text-decoration: none;
      font-family: inherit;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.1);
    }

    .action-item:active {
      transform: scale(0.95);
      background: #edf0f2;
    }

    .action-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .action-badge {
      width: 26px;
      height: 26px;
      margin-bottom: 7px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
    }

    .map-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #ffffff;
      border-radius: 12px;
      margin-top: 4px;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.08);
    }

    .map-pin {
      flex-shrink: 0;
      width: 36px; height: 36px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .map-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .map-text span {
      color: var(--text-mute);
      font-size: 12px;
    }

    /* =====================================================
       6. 푸터 (스타일 수정됨)
    ===================================================== */
    .footer {
      text-align: center;
      padding: 32px 0 10px;
      font-size: 20px; /* 기존 10px에서 2배 확대 */
      color: #7A8080; /* 요청하신 색상으로 변경 */
      letter-spacing: 0.15em;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 디지털 명함 카드 -->
    <div class="business-card" id="business-card">
      <div class="brand-logo-area">
        <img src="byd-logo.png" alt="BYD Logo" class="byd-logo-img" />
      </div>
      <div class="card-content">
        <div class="name-line">
          박 민 용
          <span class="title">팀장/차장</span>
        </div>
        <div class="sub-title-line">Sales | Team Manager</div>
        <div class="showroom-line">BYD Ilsan Showroom</div>
        <div class="info-line">경기 고양시 일산동구 백마로 516</div>
        <div class="info-line">minyong.park@dtnetworks.co.kr</div>
        <div class="info-line phone-bold">010 - 8941 - 1004</div>
      </div>
    </div>

    <!-- 주요 CTA 버튼 행 -->
    <div class="cta-row">
      <button class="cta-button cta-primary" onclick="handleAction('tel:01089411004')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 a19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67 A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91 a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        통화하기
      </button>
      <button class="cta-button cta-secondary" onclick="handleSaveContact()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        연락처 저장
      </button>
    </div>

    <!-- CONTACT 섹션 -->
    <div class="section">
      <div class="section-title">CONTACT</div>
      <div class="action-grid">
        <button class="action-item" onclick="handleAction('tel:0319110940')">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="action-label">전시장 전화</span>
        </button>
        <button class="action-item" onclick="handleAction('sms:01089411004')">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="action-label">문자 보내기</span>
        </button>
        <button class="action-item" onclick="handleAction('mailto:minyong.park@dtnetworks.co.kr')">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
          </svg>
          <span class="action-label">이메일</span>
        </button>
        <button class="action-item" onclick="handleShare()">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
          <span class="action-label">명함 공유</span>
        </button>
      </div>
    </div>

    <!-- e-CATALOG 섹션 -->
    <div class="section">
      <div class="section-title">e-Catalog</div>
      <div class="action-grid" style="grid-template-columns:repeat(2,1fr); gap:10px;">
        <button class="action-item" onclick="handleCatalog('https://www.bydauto.kr/static/file/BYD_DOLPHIN_Catalog.pdf')">
          <span class="action-label" style="font-size:13px;font-weight:700;">DOLPHIN</span>
        </button>
        <button class="action-item" onclick="handleCatalog('https://www.bydauto.kr/static/file/BYD_ATTO_3_Catalog.pdf')">
          <span class="action-label" style="font-size:13px;font-weight:700;">ATTO3</span>
        </button>
        <button class="action-item" onclick="handleCatalog('https://www.bydauto.kr/static/file/seal_catalog.pdf')">
          <span class="action-label" style="font-size:13px;font-weight:700;">SEAL</span>
        </button>
        <button class="action-item" onclick="handleCatalog('https://www.bydauto.kr/static/file/BYD_SEALION_7_Catalog.pdf')">
          <span class="action-label" style="font-size:13px;font-weight:700;">SEALION7</span>
        </button>
      </div>
    </div>

    <!-- SHOWROOM LOCATION 섹션 -->
    <div class="section">
      <div class="section-title">SHOWROOM LOCATION</div>
      <div class="map-info">
        <div class="map-pin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="map-text">
          <strong>DT네트웍스 일산전시장</strong>
          <span>경기도 고양시 일산동구 백마로 516</span>
        </div>
      </div>
      <div class="action-grid" style="margin-top:12px; grid-template-columns:repeat(3,1fr);">
        <button class="action-item" onclick="handleMap('tmap')">
          <div class="action-badge" style="background:#0086FF;color:#fff;">T</div>
          <span class="action-label">티맵</span>
        </button>
        <button class="action-item" onclick="handleMap('kakao')">
          <div class="action-badge" style="background:#FEE500;color:#111;">K</div>
          <span class="action-label">카카오맵</span>
        </button>
        <button class="action-item" onclick="handleMap('naver')">
          <div class="action-badge" style="background:#03C75A;color:#fff;">N</div>
          <span class="action-label">네이버맵</span>
        </button>
      </div>
    </div>

    <!-- 푸터 -->
    <div class="footer">BYD | DT NETWORKS | Ilsan</div>

  </div>

<script>
/* =====================================================
   CONTACT CONFIG
===================================================== */
const CONTACT = {
  name: '박민용',
  title: '팀장/차장',
  company: 'DT Networks',
  showroom: 'DT네트웍스 일산전시장',
  mobile: '01089411004',
  office: '0319110940',
  email: 'minyong.park@dtnetworks.co.kr',
  address: '경기도 고양시 일산동구 백마로 516',
  placeQuery: 'DT네트웍스 일산전시장'
};

/* =====================================================
   유틸리티 및 핸들러
===================================================== */
function reloadPage() {
  setTimeout(() => { window.location.reload(); }, 500);
}

function handleAction(url) {
  window.location.href = url;
  reloadPage();
}

function handleCatalog(url) {
  window.open(url, '_blank');
  reloadPage();
}

function handleShare() {
  alert('명함 링크 복사 완료');
  reloadPage();
}

function handleMap(type) {
  if (type === 'tmap') openTmap();
  else if (type === 'kakao') openKakaoMap();
  else if (type === 'naver') openNaverMap();
  reloadPage();
}

function handleSaveContact() {
  saveContact();
  reloadPage();
}

function saveContact() {
  const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${CONTACT.name}\nORG:${CONTACT.company}\nTITLE:${CONTACT.title}\nTEL;TYPE=CELL:${CONTACT.mobile}\nTEL;TYPE=WORK:${CONTACT.office}\nEMAIL:${CONTACT.email}\nADR:;;${CONTACT.address};;;;\nEND:VCARD`;
  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${CONTACT.name}.vcf`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function tryAppLink(appUrl, fallbackUrl) {
  const timer = setTimeout(() => { window.location.href = fallbackUrl; }, 1200);
  window.location.href = appUrl;
  window.addEventListener('pagehide', () => { clearTimeout(timer); }, { once:true });
}

function openTmap() {
  const q = encodeURIComponent(CONTACT.placeQuery);
  tryAppLink(`tmap://search?name=${q}`, 'https://surl.tmobiapi.com/d97deca3');
}

function openKakaoMap() {
  window.location.href = `https://map.kakao.com/link/search/${encodeURIComponent(CONTACT.placeQuery)}`;
}

function openNaverMap() {
  const q = encodeURIComponent(CONTACT.placeQuery);
  tryAppLink(`nmap://search?query=${q}&appname=dt.networks.card`, `https://map.naver.com/p/search/${q}`);
}
</script>

</body>
</html>
