<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>박민용 | BYD 일산전시장</title>

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="박민용 팀장 | BYD Ilsan" />
  <meta property="og:description" content="010-8941-1004" />
  <meta property="og:image" content="byd-logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="theme-color" content="#3753B1" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --card-bg: #e2e3e5;
      --text-main: #4e5356;
      --text-mute: #7a8080;
      --accent-deep: #3753b1;
      --accent-light: #4f9edd;
      --paper: #efefef;
      --btn-bg: #e2e3e5;
      --paper-soft: #f8f9fa;
    }

    html,
    body {
      background: var(--paper-soft);
    }

    body {
      font-family: "Source Sans Pro", "Pretendard", -apple-system, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px 14px 60px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .business-card {
      position: relative;
      background: var(--card-bg);
      aspect-ratio: 1.72 / 1;
      width: 100%;
      border-radius: 14px;
      box-shadow:
        0 26px 40px -12px rgba(0, 0, 0, 0.22),
        0 12px 18px -6px rgba(0, 0, 0, 0.14),
        0 1px 0 0 rgba(255, 255, 255, 0.6) inset;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      animation: cardIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .business-card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent-light));
      pointer-events: none;
    }

    .brand-logo-area {
      position: absolute;
      top: 12%;
      right: 6%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .byd-logo-img {
      width: clamp(95px, 22vw, 125px);
      height: auto;
      display: block;
      opacity: 0.9;
    }

    .card-content {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 11%;
      z-index: 2;
    }

    .name-line {
      font-weight: 700;
      font-size: clamp(20px, 4.8vw, 26px);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .name-line span.title {
      font-size: 0.52em;
      font-weight: 600;
      color: var(--text-mute);
    }

    .sub-title-line,
    .showroom-line,
    .info-line {
      font-family: "Source Sans Pro", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      color: var(--text-mute);
      margin-bottom: 2.7px;
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .info-line.phone-bold {
      font-weight: 800;
      color: var(--text-main);
      font-size: clamp(13px, 3vw, 16px);
      margin-top: 0;
      margin-bottom: 0;
    }

    .section {
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.12);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cta-button {
      padding: 15px 12px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: -0.01em;
    }

    .cta-button:active {
      transform: scale(0.97);
    }

    .cta-primary {
      background: var(--accent-deep);
      color: #ffffff;
      box-shadow: 0 10px 22px -4px rgba(55, 83, 177, 0.45);
    }

    .cta-secondary {
      background: var(--btn-bg);
      color: var(--accent-deep);
      border: 1.5px solid var(--accent-deep);
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.15);
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 4px 12px;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      border: none;
      color: inherit;
      text-decoration: none;
      font-family: inherit;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.1);
    }

    .action-item:active {
      transform: scale(0.95);
      background: #edf0f2;
    }

    .action-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .action-badge {
      width: 26px;
      height: 26px;
      margin-bottom: 7px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
    }

    .map-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #ffffff;
      border-radius: 12px;
      margin-top: 4px;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.08);
    }

    .map-pin {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-pin .material-icons-outlined {
      font-size: 36px;
      color: #4e5356;
      line-height: 1;
    }

    .map-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .map-text span {
      color: var(--text-mute);
      font-size: 12px;
    }

    .footer {
      text-align: center;
      padding: 32px 0 10px;
      font-size: 14px;
      color: #bbb;
      letter-spacing: 0.15em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: white;
      padding: 13px 22px;
      border-radius: 32px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 12px 32px -8px rgba(0,0,0,0.4);
      letter-spacing: -0.01em;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .floating-call {
      position: fixed;
      right: 18px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #3753b1, #4f9edd);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 28px rgba(55,83,177,0.35);
      z-index: 999;
      cursor: pointer;
    }

    .floating-call:active {
      transform: scale(0.94);
    }
  </style>
</head>

<body>

<div class="container">

  <div class="business-card" id="business-card">

    <div class="brand-logo-area">
      <img src="byd-logo.png" alt="BYD Logo" class="byd-logo-img" />
    </div>

    <div class="card-content">
      <div class="name-line">
        박 민 용
        <span class="title">팀장/차장</span>
      </div>

      <div class="sub-title-line">Sales | Team Manager</div>
      <div class="showroom-line">BYD Ilsan Showroom</div>
      <div class="info-line">경기 고양시 일산동구 백마로 516</div>
      <div class="info-line">minyong.park@dtnetworks.co.kr</div>
      <div class="info-line phone-bold">010 - 8941 - 1004</div>
    </div>
  </div>

  <div class="cta-row">
    <button class="cta-button cta-primary" onclick="window.open('tel:01089411004')">
      <svg width="27" height="27" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
                 a19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67
                 A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
                 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91
                 a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45
                 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      통화하기
    </button>

    <button class="cta-button cta-secondary" onclick="saveContact()">
      <svg width="27" height="27" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"

  <div class="section">
    <div class="section-title">CONTACT</div>

    <div class="action-grid">
      <button class="action-item" onclick="window.open('tel:0319110940')">
        <svg class="action-icon" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>

      <button class="action-item" onclick="window.open('sms:01089411004')">
        <span class="material-icons-outlined action-icon" style="width:auto;height:auto;font-size:24px;margin-bottom:8px;">textsms</span>
        <span class="action-label">문자 보내기</span>

      <button class="action-item" onclick="window.open('mailto:minyong.park@dtnetworks.co.kr')">
        <svg class="action-icon" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span class="action-label">이메일</span>
      </button>

      <button class="action-item" onclick="copyLink()">
        <svg class="action-icon" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>

          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        <span class="action-label">링크 복사</span>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">e-Catalog</div>

    <div class="action-grid" style="grid-template-columns:repeat(2,1fr); gap:10px;">
      <button class="action-item" onclick="window.open('https://www.bydauto.kr/static/file/BYD_DOLPHIN_Catalog.pdf','_blank')">
        <span class="action-label" style="font-size:18px;font-weight:700;">DOLPHIN</span>
      </button>

      <button class="action-item" onclick="window.open('https://www.bydauto.kr/static/file/BYD_ATTO_3_Catalog.pdf','_blank')">
        <span class="action-label" style="font-size:18px;font-weight:700;">ATTO3</span>
      </button>

      <button class="action-item" onclick="window.open('https://www.bydauto.kr/static/file/seal_catalog.pdf','_blank')">

      <button class="action-item" onclick="window.open('https://www.bydauto.kr/static/file/BYD_SEALION_7_Catalog.pdf','_blank')">

  <div class="section">

    <div class="map-info">
      <div class="map-pin"><span class="material-icons-outlined">maps_home_work</span></div>
      <div class="map-text">
        <strong>BYD Auto 일산전시장</strong>
        <span>경기도 고양시 일산동구 백마로 516</span>
      </div>
    </div>

    <div class="action-grid" style="margin-top:12px; grid-template-columns:repeat(3,1fr);">
      <button class="action-item" onclick="openTmap()">

  <div class="cta-row" style="grid-template-columns:1fr;">
    <button class="cta-button cta-secondary" onclick="downloadCardImage()">
      <span class="material-icons-outlined" style="font-size:27px;color:var(--accent-deep);line-height:1;">save</span>
      명함 이미지로 저장

</div>

<button class="floating-call" onclick="window.open('tel:01089411004')">
  ☎
</button>

<div class="toast" id="toast"></div>

<script>
const CONTACT_INFO = {
  firstName: '박민용',
  lastName: 'BYD',
  fullName: 'BYD박민용',
  title: '팀장/차장',
  company: 'BYD 일산전시장',
  mobile: '01089411004',
  office: '0319329108',
  email: 'minyong.park@dtnetworks.co.kr',
  address: '경기 고양시 일산동구 백마로 516',
  placeQuery: 'BYD 일산전시장',
  website: window.location.href
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    t.classList.remove('show');
  }, 2200);
}

function saveContact() {
  const info = CONTACT_INFO;

  // RFC 6350 / vCard 3.0 호환 — iOS & Android 모두 지원
  // 줄바꿈은 반드시 CRLF(\r\n), BOM 없음, UTF-8 인코딩
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    // N 필드: 성;이름;추가이름;경칭;접미사
    'N:박;민용;;;',
    'FN:박민용',
    'ORG:BYD 일산전시장',
    'TITLE:팀장/차장',
    'TEL;TYPE=CELL,VOICE:010-8941-1004',
    'TEL;TYPE=WORK,VOICE:031-932-9108',
    'EMAIL;TYPE=WORK,INTERNET:minyong.park@dtnetworks.co.kr',
    'URL;TYPE=WORK:' + info.website,
    'END:VCARD'
  ];

  const vcfText = lines.join('\r\n') + '\r\n';

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  if (isIOS) {
    // iOS: data URI 방식 — <a> 클릭 다운로드가 Safari에서 작동 안 함
    // → window.open 으로 직접 열어야 연락처 앱에서 "연락처 추가" 팝업 뜸
    const encoded = encodeURIComponent(vcfText);
    const dataUri = 'data:text/vcard;charset=utf-8,' + encoded;
    window.open(dataUri, '_blank');
  } else {
    // Android / Desktop: Blob + 링크 클릭
    const blob = new Blob([vcfText], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '박민용_BYD.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  showToast('연락처를 저장하세요 📇');
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href)
    .then(() => showToast('링크가 복사되었습니다'));
}

function tryAppLink(appUrl, fallbackUrl) {
  const timer = setTimeout(() => {
    window.location.href = fallbackUrl;
  }, 1200);

  window.location.href = appUrl;

  window.addEventListener('pagehide', () => {
    clearTimeout(timer);
  }, { once: true });
}

function openTmap() {
  const q = encodeURIComponent(CONTACT_INFO.placeQuery);
  tryAppLink(`tmap://search?name=${q}`, 'https://surl.tmobiapi.com/d97deca3');
}

function openKakaoMap() {
  window.location.href = `https://map.kakao.com/link/search/${encodeURIComponent(CONTACT_INFO.placeQuery)}`;
}

function openNaverMap() {
  const q = encodeURIComponent(CONTACT_INFO.placeQuery);
  tryAppLink(`nmap://search?query=${q}&appname=dt.networks.card`, `https://map.naver.com/p/search/${q}`);
}

const CARD_IMAGE_URL = 'https://raw.githubusercontent.com/bydilsanmy/BYDIlsanMY/main/BYD-PMY-namecard.jpg';
const CARD_IMAGE_FILENAME = '박민용_BYD명함.jpg';

function downloadCardImage() {
  fetch(CARD_IMAGE_URL)
    .then(res => res.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = CARD_IMAGE_FILENAME;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast('명함 이미지가 저장되었습니다');
    })
    .catch(() => {
      window.open(CARD_IMAGE_URL, '_blank');
    });
}
</script>

</body>
</html>
