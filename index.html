<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>박민용 | DT Networks 일산전시장</title>

  <meta property="og:type" content="profile" />
  <meta property="og:title" content="박민용 팀장/차장 | DT Networks" />
  <meta
    property="og:description"
    content="Sales | Team Manager | 010-8941-1004"
  />
  <meta property="og:image" content="byd-logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="theme-color" content="#3753B1" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --card-bg: #efefef;
      --text-main: #4e5356;
      --text-mute: #7a8080;
      --accent-deep: #3753b1;
      --accent-light: #4f9edd;

      --paper: #ffffff;
      --btn-bg: #efefef;
      --paper-soft: #f8f9fa;
    }

    html,
    body {
      background: var(--paper-soft);
    }

    body {
      font-family: "Source Sans Pro", "Pretendard", -apple-system, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px 14px 60px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* ===== 디지털 명함 ===== */

    .business-card {
      position: relative;
      background: var(--card-bg);
      aspect-ratio: 1.72 / 1;
      width: 100%;
      border-radius: 14px;
      box-shadow:
        0 26px 40px -12px rgba(0, 0, 0, 0.22),
        0 12px 18px -6px rgba(0, 0, 0, 0.14),
        0 1px 0 0 rgba(255, 255, 255, 0.6) inset;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      animation: cardIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .business-card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--accent-deep),
        var(--accent-light)
      );
      pointer-events: none;
    }

    /* 로고 */

    .brand-logo-area {
      position: absolute;
      top: 12%;
      right: 6%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .byd-logo-img {
      width: clamp(95px, 22vw, 125px);
      height: auto;
      display: block;
      opacity: 0.9;
    }

    /* 텍스트 */

    .card-content {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 11%;
      z-index: 2;
    }

    .name-line {
      font-weight: 700;
      font-size: clamp(20px, 4.8vw, 26px);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .name-line span.title {
      font-size: 0.52em;
      font-weight: 600;
      color: var(--text-mute);
    }

    /* 30% 확대 + 문단 간격 10% 감소 */

    .sub-title-line {
      font-family: "Source Sans Pro", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      color: var(--text-mute);
      margin-bottom: 2.7px;
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .showroom-line {
      font-family: "Source Sans Pro", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      color: var(--text-mute);
      margin-bottom: 2.7px;
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    .info-line {
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      line-height: 1.28;
      color: var(--text-mute);
      letter-spacing: -0.01em;
      margin-bottom: 2.7px;
    }

    .info-line.phone-bold {
      font-weight: 800;
      color: var(--text-main);
      font-size: clamp(13px, 3vw, 15.5px);
      margin-top: 0;
      margin-bottom: 0;
    }

    /* ===== 하단 섹션 ===== */

    .section {
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.12);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .cta-button {
      padding: 15px 12px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition:
        transform 0.12s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
      letter-spacing: -0.01em;
    }

    .cta-button:active {
      transform: scale(0.97);
    }

    .cta-primary {
      background: var(--accent-deep);
      color: #ffffff;
      box-shadow: 0 10px 22px -4px rgba(55, 83, 177, 0.45);
    }

    .cta-primary:hover {
      background: #2b4291;
    }

    .cta-secondary {
      background: var(--btn-bg);
      color: var(--accent-deep);
      border: 1.5px solid var(--accent-deep);
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.15);
    }

    .cta-secondary:hover {
      background: #e5e5e5;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 4px 12px;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition:
        transform 0.1s ease,
        background 0.2s ease;
      border: none;
      color: inherit;
      text-decoration: none;
      font-family: inherit;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.1);
    }

    .action-item:active {
      transform: scale(0.95);
      background: #edf0f2;
    }

    .action-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .action-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
    }

    .map-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #ffffff;
      border-radius: 12px;
      margin-top: 4px;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.08);
    }

    .map-pin {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .map-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .map-text span {
      color: var(--text-mute);
      font-size: 11.5px;
    }

    .footer {
      text-align: center;
      padding: 32px 0 10px;
      font-size: 10px;
      color: #bbb;
      letter-spacing: 0.15em;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>
