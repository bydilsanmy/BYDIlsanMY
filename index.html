<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일 뷰포트 설정: 확대/축소 비활성화 -->

  <!-- ===== 폰트 프리커넥트: DNS 조회 선행으로 렌더링 지연 최소화 ===== -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Pretendard (한글 본문용) -->
  <link
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    rel="stylesheet"
  />
  <!-- Source Sans Pro (영문/숫자 강조용) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =====================================================
       1. 전역 리셋 & 박스 모델
    ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 모바일 탭 하이라이트 제거 */
    }

    /* =====================================================
       2. CSS 변수 (디자인 토큰)
       - 색상, 배경, 강조색을 한 곳에서 관리
    ===================================================== */
    :root {
      --card-bg:       #e2e3e5;  /* 명함 카드 배경 */
      --text-main:     #4e5356;  /* 주요 텍스트 */
      --text-mute:     #7a8080;  /* 보조 텍스트 */
      --accent-deep:   #3753b1;  /* 강조색 (딥 블루) */
      --accent-light:  #4f9edd;  /* 강조색 (라이트 블루) */
      --paper:         #efefef;  /* 흰 배경 (카드 내부 등) */
      --btn-bg:        #e2e3e5;  /* 버튼/섹션 배경 */
      --paper-soft:    #f8f9fa;  /* 페이지 전체 배경 */
    }

    /* =====================================================
       3. 기본 레이아웃
    ===================================================== */
    html,
    body {
      background: var(--paper-soft);
    }

    body {
      font-family: "Source Sans Pro", "Pretendard", -apple-system, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px 14px 60px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased; /* macOS/iOS 폰트 렌더링 최적화 */
    }

    /* 콘텐츠 최대 너비 제한 (모바일 중심 레이아웃) */
    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* =====================================================
       4. 디지털 명함 카드
    ===================================================== */

    /* 카드 외형: 황금비(1.72:1) 종횡비, 그림자, 입장 애니메이션 */
    .business-card {
      position: relative;
      background: var(--card-bg);
      aspect-ratio: 1.72 / 1;
      width: 100%;
      border-radius: 14px;
      box-shadow:
        0 26px 40px -12px rgba(0, 0, 0, 0.22),  /* 멀리 퍼지는 큰 그림자 */
        0 12px 18px -6px rgba(0, 0, 0, 0.14),   /* 중간 그림자 */
        0 1px 0 0 rgba(255, 255, 255, 0.6) inset; /* 상단 내측 하이라이트 */
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      animation: cardIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    /* 카드 등장 키프레임: 아래서 위로 슬라이드 + 페이드인 */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* 카드 하단 블루 그라디언트 포인트 라인 */
    .business-card::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent-light));
      pointer-events: none;
    }

    /* BYD 로고 영역: 카드 우측 상단 */
    .brand-logo-area {
      position: absolute;
      top: 12%; right: 6%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* BYD 로고 이미지: clamp로 반응형 크기 조정 */
    .byd-logo-img {
      width: clamp(95px, 22vw, 125px);
      height: auto;
      display: block;
      opacity: 0.9;
    }

    /* 카드 텍스트 컨테이너: 카드 좌하단에 절대 배치 */
    .card-content {
      position: absolute;
      left: 6%; right: 6%; bottom: 11%;
      z-index: 2;
    }

    /* 이름 줄: 한국어 이름 + 직함 배지 */
    .name-line {
      font-weight: 700;
      font-size: clamp(20px, 4.8vw, 26px); /* 반응형 폰트 크기 */
      margin-bottom: 5px;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    /* 직함 서브텍스트 (팀장/차장) */
    .name-line span.title {
      font-size: 0.52em;  /* 이름 폰트의 52% 크기 */
      font-weight: 600;
      color: var(--text-mute);
    }

    /* 직책·전시장·정보 공통 스타일 (보조 텍스트 줄들) */
    .sub-title-line,
    .showroom-line,
    .info-line {
      font-family: "Source Sans Pro", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 2.9vw, 15.6px);
      color: var(--text-mute);
      margin-bottom: 2.7px;
      letter-spacing: 0.01em;
      line-height: 1.28;
    }

    /* 전화번호 줄: 굵게 강조 */
    .info-line.phone-bold {
      font-weight: 800;
      color: var(--text-main);
      font-size: clamp(13px, 3vw, 16px);
      margin-top: 0;
      margin-bottom: 0;
    }

    /* =====================================================
       5. 하단 섹션 (버튼 그룹, 연락처 허브, 지도)
    ===================================================== */

    /* 공통 섹션 카드 스타일 */
    .section {
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.12);
    }

    /* 섹션 타이틀 레이블 (소문자→대문자 자동 변환) */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* CTA 버튼 2열 그리드 */
    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    /* CTA 버튼 공통 스타일 */
    .cta-button {
      padding: 15px 12px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
      letter-spacing: -0.01em;
    }

    /* 탭 시 살짝 눌리는 피드백 */
    .cta-button:active { transform: scale(0.97); }

    /* 주요 CTA: 딥 블루 채운 버튼 */
    .cta-primary {
      background: var(--accent-deep);
      color: #ffffff;
      box-shadow: 0 10px 22px -4px rgba(55, 83, 177, 0.45);
    }
    .cta-primary:hover { background: #2b4291; }

    /* 보조 CTA: 아웃라인 버튼 */
    .cta-secondary {
      background: var(--btn-bg);
      color: var(--accent-deep);
      border: 1.5px solid var(--accent-deep);
      box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.15);
    }
    .cta-secondary:hover { background: #e5e5e5; }

    /* 연락처: 4열 아이콘 그리드 */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    /* 개별 아이콘 버튼 (전시장 전화, 문자, 이메일, 공유) */
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 4px 12px;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      border: none;
      color: inherit;
      text-decoration: none;
      font-family: inherit;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.1);
    }

    /* 아이콘 버튼 탭 피드백 */
    .action-item:active {
      transform: scale(0.95);
      background: #edf0f2;
    }

    /* SVG 아이콘 크기 및 여백 */
    .action-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    
    .action-badge {
      width: 26px;
      height: 26px;
      margin-bottom: 7px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }

    /* 아이콘 하단 레이블 텍스트 */
    .action-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
    }

    /* 지도 정보 행: 핀 아이콘 + 주소 텍스트 */
    .map-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #ffffff;
      border-radius: 12px;
      margin-top: 4px;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.08);
    }

    /* 지도 핀 원형 배경 */
    .map-pin {
      flex-shrink: 0;
      width: 36px; height: 36px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* 전시장명 */
    .map-text strong {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    /* 전시장 주소 */
    .map-text span {
      color: var(--text-mute);
      font-size: 12px;
    }

    /* =====================================================
       6. 푸터
    ===================================================== */
    .footer {
      text-align: center;
      padding: 32px 0 10px;
      font-size: 10px;
      color: #bbb;
      letter-spacing: 0.15em;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

<script>
/* =====================================================
   CONTACT CONFIG

===================================================== */
const CONTACT = {
  name: '박민용',
  title: '팀장/차장',
  company: 'DT Networks',
  showroom: 'DT네트웍스 일산전시장',
  mobile: '01089411004',
  office: '0319110940',
  email: 'minyong.park@dtnetworks.co.kr',
  address: '경기도 고양시 일산동구 백마로 516',
  placeQuery: 'DT네트웍스 일산전시장'
};

/* =====================================================
   연락처 저장 (vCard 생성)
===================================================== */
function saveContact() {
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${CONTACT.name}
ORG:${CONTACT.company}
TITLE:${CONTACT.title}
TEL;TYPE=CELL:${CONTACT.mobile}
TEL;TYPE=WORK:${CONTACT.office}
EMAIL:${CONTACT.email}
ADR:;;${CONTACT.address};;;;
END:VCARD`;

  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const link = document.createElement('a');
  link.href = url;
  link.download = `${CONTACT.name}.vcf`;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  URL.revokeObjectURL(url);
}

/* =====================================================
   지도 앱 연동
   - 원본.html 방식 기반 검증 완료
===================================================== */
function tryAppLink(appUrl, fallbackUrl) {
  const timer = setTimeout(() => {
    window.location.href = fallbackUrl;
  }, 1200);

  window.location.href = appUrl;

  window.addEventListener('pagehide', () => {
    clearTimeout(timer);
  }, { once:true });
}

/* 티맵 */
function openTmap() {
  const q = encodeURIComponent(CONTACT.placeQuery);

  tryAppLink(
    `tmap://search?name=${q}`,
    'https://surl.tmobiapi.com/d97deca3'
  );
}

/* 카카오맵 */
function openKakaoMap() {
  window.location.href =
    `https://map.kakao.com/link/search/${encodeURIComponent(CONTACT.placeQuery)}`;
}

/* 네이버맵 */
function openNaverMap() {
  const q = encodeURIComponent(CONTACT.placeQuery);

  tryAppLink(
    `nmap://search?query=${q}&appname=dt.networks.card`,
    `https://map.naver.com/p/search/${q}`
  );
}
</script>


<script>
/* =====================================================
   CONTACT INFO

   - 수정 시 아래만 변경하면 전체 자동 반영
===================================================== */
const CONTACT_INFO = {
  firstName: "박민용",
  lastName: "BYD",
  fullName: "BYD박민용",
  title: "팀장/차장",
  company: "BYD 일산전시장",
  mobile: "01089411004",
  office: "0319110940",
  email: "minyong.park@dtnetworks.co.kr",
  address: "경기 고양시 일산동구 백마로 516",
  website: window.location.href
};

/* =====================================================
   vCard 연락처 저장
   - iPhone / Android 기본 연락처앱 호환
   - UTF-8 한글 지원
===================================================== */
function saveContact() {

  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${CONTACT_INFO.lastName};${CONTACT_INFO.firstName}`,
    `FN:${CONTACT_INFO.fullName}`,
    `ORG:${CONTACT_INFO.company}`,
    `TITLE:${CONTACT_INFO.title}`,
    `TEL;TYPE=CELL:${CONTACT_INFO.mobile}`,
    `TEL;TYPE=WORK:${CONTACT_INFO.office}`,
    `EMAIL;TYPE=WORK:${CONTACT_INFO.email}`,
    `ADR;TYPE=WORK:;;${CONTACT_INFO.address}`,
    `URL:${CONTACT_INFO.website}`,
    "END:VCARD"
  ].join("\n");

  const blob = new Blob(
    ["\uFEFF" + vcard],
    { type: "text/vcard;charset=utf-8" }
  );

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${CONTACT_INFO.fullName}.vcf`;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}
</script>
